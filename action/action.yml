name: Dotnetarium C# Security Scan
description: Scan C# and .NET 8/10 without building, with SARIF security alerts, data flows and PR annotations.
branding:
  icon: shield
  color: blue
inputs:
  target:
    description: Repository-relative .sln, .slnx or .csproj path.
    required: true
  version:
    description: Exact stable CLI version, 2.7.0 or newer.
    default: '2.7.0'
  setup-dotnet:
    description: Install SDKs; disable when the job already prepared them.
    default: 'true'
  dotnet-version:
    description: SDK versions for the scanner and target projects.
    default: |
      8.0.x
      10.0.x
  restore:
    description: Run dotnet restore; disable when this workspace is already restored.
    default: 'true'
  project-mode:
    description: Use SDK/MSBuild design-time loading instead of default no-build loading.
    default: 'false'
  config:
    description: Optional repository-relative dotnetarium.json path.
  configuration:
    description: Project configuration used for both restore and scanning.
    default: Debug
  framework:
    description: Optional root target framework, net8.0 or net10.0.
  sarif-file:
    description: Repository-relative output file. Use a distinct path for each invocation.
    default: dotnetarium.sarif
  upload-sarif:
    description: Upload to GitHub code scanning; disable for artifact-only integrations.
    default: 'true'
  category:
    description: Stable code scanning category; use different categories for separate targets.
    default: dotnetarium
outputs:
  sarif-file:
    description: Absolute SARIF output path.
    value: ${{ steps.prepare.outputs.sarif-file }}
  findings:
    description: Number of security findings, excluding informational analysis limits.
    value: ${{ steps.scan.outputs.findings }}
  input-status:
    description: Input status reported by the CLI.
    value: ${{ steps.scan.outputs.input-status }}
  analysis-status:
    description: Analysis status reported by the CLI.
    value: ${{ steps.scan.outputs.analysis-status }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      id: prepare
      shell: pwsh
      env:
        DNA_TARGET: ${{ inputs.target }}
        DNA_VERSION: ${{ inputs.version }}
        DNA_SETUP: ${{ inputs.setup-dotnet }}
        DNA_RESTORE: ${{ inputs.restore }}
        DNA_PROJECT: ${{ inputs.project-mode }}
        DNA_UPLOAD: ${{ inputs.upload-sarif }}
        DNA_CONFIG: ${{ inputs.config }}
        DNA_CONFIGURATION: ${{ inputs.configuration }}
        DNA_FRAMEWORK: ${{ inputs.framework }}
        DNA_SARIF: ${{ inputs.sarif-file }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/Prepare.ps1"'
    - name: Install .NET SDKs
      if: inputs.setup-dotnet == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Install pinned CLI
      shell: pwsh
      env:
        DNA_VERSION: ${{ inputs.version }}
        DNA_TOOL: ${{ steps.prepare.outputs.tool-directory }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/Install.ps1"'
    - name: Restore dependencies
      if: inputs.restore == 'true'
      shell: pwsh
      env:
        DNA_TARGET: ${{ steps.prepare.outputs.target }}
        DNA_CONFIGURATION: ${{ inputs.configuration }}
        DNA_FRAMEWORK: ${{ inputs.framework }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/Restore.ps1"'
    - name: Scan
      id: scan
      shell: pwsh
      env:
        DNA_TARGET: ${{ steps.prepare.outputs.target }}
        DNA_TOOL: ${{ steps.prepare.outputs.tool-directory }}
        DNA_SARIF: ${{ steps.prepare.outputs.sarif-file }}
        DNA_CONFIG: ${{ steps.prepare.outputs.config }}
        DNA_CONFIGURATION: ${{ inputs.configuration }}
        DNA_FRAMEWORK: ${{ inputs.framework }}
        DNA_PROJECT: ${{ inputs.project-mode }}
      run: '& "$env:GITHUB_ACTION_PATH/scripts/Scan.ps1"'
    - name: Upload SARIF
      if: ${{ !cancelled() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-ready == 'true' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ steps.prepare.outputs.sarif-file }}
        category: ${{ inputs.category }}
    - name: Report execution failure
      if: ${{ !cancelled() && steps.scan.outputs.exit-code != '' && steps.scan.outputs.exit-code != '0' }}
      shell: pwsh
      env:
        DNA_EXIT: ${{ steps.scan.outputs.exit-code }}
      run: |
        Write-Error "Dotnetarium failed with exit code $env:DNA_EXIT. Inspect the scan log and SARIF invocation."
        exit 1
