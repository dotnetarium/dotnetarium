name: Build and test

on:
  push:
    branches: ["main", "2.0", "experiment/build-independent-roslyn"]
  pull_request:
    branches: ["main", "2.0"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and run unit tests
        run: dotnet test Dotnetarium.sln -c Release -p:RunAnalyzers=false
      - name: Test modern sinks
        run: dotnet run --project tests/ModernSinkSmoke/ModernSinkSmoke.csproj -c Release -p:RunAnalyzers=false
      - name: Test build-independent Roslyn experiment
        shell: pwsh
        env:
          DOTNETARIUM_EXPERIMENT_REPORTS: ${{ runner.temp }}
        run: |
          dotnet build Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/BuildIndependentSmoke/Test.ps1
      - name: Upload experimental input comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-inputs-windows
          path: |
            ${{ runner.temp }}/dotnetarium-direct-*/*.json
            ${{ runner.temp }}/dotnetarium-direct-*/*.sarif
            ${{ runner.temp }}/dotnetarium-direct-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Test Razor and Blazor flows
        shell: pwsh
        run: ./tests/RazorSmoke/Test.ps1
      - name: Pack analyzer and global tool
        run: |
          dotnet pack Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -c Release -p:RunAnalyzers=false -o artifacts
          dotnet pack Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false -o artifacts
      - name: Scan through installed global tool
        shell: pwsh
        run: ./tests/CliSmoke/Test.ps1
      - name: Check identifier and boundary precision on .NET 8 and 10
        shell: pwsh
        run: ./tests/TaintPrecisionSmoke/Test.ps1 -ExperimentalDirect
      - name: Check Markdown, archive extraction and generated Razor CLI coverage
        shell: pwsh
        run: ./tests/MarkupArchiveSmoke/Test.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnetarium-2-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  linux-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build packages
        run: |
          dotnet build Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -c Release -p:RunAnalyzers=false
          dotnet build Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false
      - name: Pack analyzer and global tool
        run: |
          dotnet pack Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -c Release -p:RunAnalyzers=false -o artifacts
          dotnet pack Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false -o artifacts
      - name: Test build-independent Roslyn experiment
        shell: pwsh
        env:
          DOTNETARIUM_EXPERIMENT_REPORTS: ${{ runner.temp }}
        run: ./tests/BuildIndependentSmoke/Test.ps1
      - name: Upload experimental input comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-inputs-linux
          path: |
            ${{ runner.temp }}/dotnetarium-direct-*/*.json
            ${{ runner.temp }}/dotnetarium-direct-*/*.sarif
            ${{ runner.temp }}/dotnetarium-direct-*/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan with lowercase project config
        shell: pwsh
        run: ./tests/CliSmoke/Test.ps1
      - name: Check identifier and boundary precision on .NET 8 and 10
        shell: pwsh
        run: ./tests/TaintPrecisionSmoke/Test.ps1 -ExperimentalDirect
      - name: Check Markdown, archive extraction and generated Razor CLI coverage
        shell: pwsh
        run: ./tests/MarkupArchiveSmoke/Test.ps1
