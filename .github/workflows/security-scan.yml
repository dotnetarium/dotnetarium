name: Dotnetarium security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    uses: dotnetarium/dotnetarium-action/.github/workflows/scan.yml@87acfa071b0724a92b8de8e7124ab5ac8906b1ff
    with:
      target: Dotnetarium.Tool/Dotnetarium.Tool.csproj
      configuration: Release
      framework: net10.0
      category: dotnetarium-self-scan
