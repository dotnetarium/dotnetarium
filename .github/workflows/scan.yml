name: Dotnetarium scan

on:
  workflow_call:
    inputs:
      target:
        description: Repository-relative solution or project path.
        required: true
        type: string
      version:
        description: Exact stable CLI version.
        default: '2.7.0'
        type: string
      config:
        description: Optional repository-relative JSON configuration path.
        default: ''
        type: string
      configuration:
        default: Debug
        type: string
      framework:
        default: ''
        type: string
      project-mode:
        default: false
        type: boolean
      restore:
        description: Run dependency restore before scanning.
        default: true
        type: boolean
      dotnet-version:
        default: |
          8.0.x
          10.0.x
        type: string
      runner:
        default: ubuntu-latest
        type: string
      upload-sarif:
        default: true
        type: boolean
      category:
        default: dotnetarium
        type: string
    outputs:
      findings:
        description: Total security findings; this is not a new-alert count.
        value: ${{ jobs.scan.outputs.findings }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan and upload
        id: scan
        uses: dotnetarium/dotnetarium/action@b380f59c3b7b4dc7318076a566adbd55a9b4d87a
        with:
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          config: ${{ inputs.config }}
          configuration: ${{ inputs.configuration }}
          framework: ${{ inputs.framework }}
          project-mode: ${{ inputs.project-mode }}
          restore: ${{ inputs.restore }}
          dotnet-version: ${{ inputs.dotnet-version }}
          upload-sarif: ${{ inputs.upload-sarif }}
          category: ${{ inputs.category }}
