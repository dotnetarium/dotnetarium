name: Build and test

on:
  push:
    branches: ["main", "2.0"]
  pull_request:
    branches: ["main", "2.0"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and run unit tests
        run: dotnet test Dotnetarium.sln -c Release -p:RunAnalyzers=false
      - name: Test modern sinks
        run: dotnet run --project tests/ModernSinkSmoke/ModernSinkSmoke.csproj -c Release -p:RunAnalyzers=false
      - name: Test Razor and Blazor flows
        shell: pwsh
        run: ./tests/RazorSmoke/Test.ps1
      - name: Pack analyzer and global tool
        run: |
          dotnet pack Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -c Release -p:RunAnalyzers=false -o artifacts
          dotnet pack Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false -o artifacts
      - name: Scan through installed global tool
        shell: pwsh
        run: ./tests/CliSmoke/Test.ps1
      - name: Check provider credentials in project and repository configuration
        shell: pwsh
        run: ./tests/ProviderCredentialSmoke/Test.ps1
      - name: Check opt-in no-build mode through installed global tool
        shell: pwsh
        run: ./tests/NoBuildSmoke/Test.ps1 -ToolPackage (Get-ChildItem artifacts/*.nupkg | Where-Object Name -Match '^dotnetarium\.\d' | Select-Object -First 1).FullName
      - name: Check identifier and boundary precision on .NET 8 and 10
        shell: pwsh
        run: ./tests/TaintPrecisionSmoke/Test.ps1
      - name: Check Markdown, archive extraction and generated Razor CLI coverage
        shell: pwsh
        run: ./tests/MarkupArchiveSmoke/Test.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnetarium-2-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  linux-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and run unit tests
        run: dotnet test Dotnetarium.sln -c Release -p:RunAnalyzers=false
      - name: Pack analyzer and global tool
        run: |
          dotnet pack Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -c Release -p:RunAnalyzers=false -o artifacts
          dotnet pack Dotnetarium.Tool/Dotnetarium.Tool.csproj -c Release -p:RunAnalyzers=false -o artifacts
      - name: Scan with lowercase project config
        shell: pwsh
        run: ./tests/CliSmoke/Test.ps1
      - name: Check provider credentials in project and repository configuration
        shell: pwsh
        run: ./tests/ProviderCredentialSmoke/Test.ps1
      - name: Check opt-in no-build mode through installed global tool
        shell: pwsh
        run: ./tests/NoBuildSmoke/Test.ps1 -ToolPackage (Get-ChildItem artifacts/*.nupkg | Where-Object Name -Match '^dotnetarium\.\d' | Select-Object -First 1).FullName
      - name: Check identifier and boundary precision on .NET 8 and 10
        shell: pwsh
        run: ./tests/TaintPrecisionSmoke/Test.ps1
      - name: Check Markdown, archive extraction and generated Razor CLI coverage
        shell: pwsh
        run: ./tests/MarkupArchiveSmoke/Test.ps1
