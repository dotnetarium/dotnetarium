name: Dotnetarium security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    uses: dotnetarium/dotnetarium-action/.github/workflows/scan.yml@166cb6892fa8c3b81171801bda62a93d52d48536
    with:
      target: Dotnetarium.Tool/Dotnetarium.Tool.csproj
      configuration: Release
      framework: net10.0
      category: dotnetarium-self-scan
