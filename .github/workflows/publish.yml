name: Publish 2.x packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v2.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify package versions match the tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $analyzer = [xml](Get-Content Dotnetarium.Analyzers/Dotnetarium.Analyzers.csproj -Raw)
          $tool = [xml](Get-Content Dotnetarium.Tool/Dotnetarium.Tool.csproj -Raw)
          if ($analyzer.SelectSingleNode('//PackageVersion').InnerText -ne $version -or
              $tool.SelectSingleNode('//Version').InnerText -ne $version) {
            throw "Package versions must match release tag $version."
          }
      - name: Validate release packages
        shell: pwsh
        run: ./tests/Run-CI.ps1 -Suite release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnetarium-release-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  linux-validation:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnetarium-release-packages
          path: artifacts
      - name: Validate the same release packages on Linux
        shell: pwsh
        run: ./tests/Run-CI.ps1 -Suite release -UseExistingPackages

  publish:
    needs: [build, linux-validation]
    runs-on: windows-latest
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnetarium-release-packages
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify release packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts -Filter '*.nupkg')
          if ($packages.Count -ne 2 -or
              -not ($packages.Name -contains "Dotnetarium.Analyzers.$($env:GITHUB_REF_NAME.Substring(1)).nupkg") -or
              -not ($packages.Name -contains "dotnetarium.$($env:GITHUB_REF_NAME.Substring(1)).nupkg")) {
            throw 'Expected analyzer and global tool packages for the release tag.'
          }
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: dbalikhin
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts -Filter '*.nupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Attach packages to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem artifacts -Filter '*.nupkg' | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
